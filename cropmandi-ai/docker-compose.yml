version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cropmandi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cropmandi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cropmandi-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/cropmandi
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY}
      - DATA_GOV_RESOURCE_ID=${DATA_GOV_RESOURCE_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cropmandi-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
